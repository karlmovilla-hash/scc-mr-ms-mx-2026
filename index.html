<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr., Ms. & Mx. St. Clare College 2026</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f4;
            color: #333;
            min-height: 100vh;
        }

        /* Google Apps Script-style notice */
        .notice {
            height: 38px;
            background: #e8f0fe;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            color: #444;
        }

        .info-icon {
            width: 18px;
            height: 18px;
            border: 1.5px solid #4285f4;
            border-radius: 50%;
            color: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }

        .notice-links {
            margin-left: auto;
            display: flex;
            gap: 20px;
        }

        .notice-links span {
            color: #4675a5;
            font-weight: bold;
        }

        .close {
            margin-left: 15px;
            font-size: 18px;
            color: #777;
            cursor: pointer;
        }

        /* Main page */
        .page {
            min-height: calc(100vh - 38px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }

        /* Card */
        .card {
            width: 445px;
            background: white;
            border-radius: 18px;
            padding: 22px 20px 28px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 17px;
        }

        /* Checked in box */
        .status {
            width: 100%;
            background: #fbdedc;
            border-radius: 10px;
            padding: 16px 10px;
            text-align: center;
            color: #8c3030;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Student information */
        .field {
            margin-bottom: 22px;
        }

        .label {
            font-size: 11px;
            font-weight: bold;
            color: #777;
            margin-bottom: 7px;
        }

        .value {
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }

        /* Responsive mobile */
        @media (max-width: 600px) {

            .notice {
                font-size: 10px;
                height: 38px;
            }

            .notice-links {
                display: none;
            }

            .page {
                padding: 30px 15px;
            }

            .card {
                width: 100%;
                max-width: 445px;
                border-radius: 17px;
            }

            .title {
                font-size: 15px;
            }

            .status {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Google Apps Script notice -->
    <div class="notice" id="notice">

        <div class="info-icon">i</div>

        <span>
            This application was created by a Google Apps Script user
        </span>

        <div class="notice-links">
            <span>Report abuse</span>
            <span>Learn more</span>
        </div>

        <div class="close" onclick="closeNotice()">×</div>
    </div>


    <!-- Main content -->
    <main class="page">

        <div class="card">

            <div class="title">
                Mr., Ms. & Mx. St. Clare College 2026
            </div>

            <div class="status">
                ALREADY CHECKED IN
            </div>

            <div class="date" id="checkInDate">
                Sep 27, 2026 12:46 AM
            </div>


            <!-- Registered Name -->
            <div class="field">
                <div class="label">
                    REGISTERED NAME
                </div>

                <div class="value">
                     Karl Francis V. Movilla
                </div>
            </div>


            <!-- Student Number -->
            <div class="field">
                <div class="label">
                    STUDENT NUMBER
                </div>

                <div class="value">
                    20261082
                </div>
            </div>


            <!-- Program / Year / Section -->
            <div class="field">
                <div class="label">
                    PROGRAM / YEAR / SECTION
                </div>

                <div class="value">
                    BSCS 1D
                </div>
            </div>

        </div>

    </main>


    <script>

        // Close the Google Apps Script notice
        function closeNotice() {
            document.getElementById("notice").style.display = "none";
        }

    </script>

</body>
</html
